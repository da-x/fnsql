[package]
name = "fnsql"
version = "0.3.1"
edition = "2021"
keywords = ["sql", "proc_macro", "procmacro"]
license = "MIT/Apache-2.0"
description = "Type-safe SQL query wrappers"
homepage = "https://github.com/da-x/fnsql"
repository = "https://github.com/da-x/fnsql"
categories = ["database"]
readme = "crates-io.md"
include = ["Cargo.toml", "src/**/*.rs", "src/**/*.yml", "src/**/*.sh", "crates-io.md", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = []
all = ["with-sqlx-sqlite", "with-postgres", "prepare-cache"]
with-sqlx-sqlite = ["fnsql-macro/with-sqlx-sqlite", "sqlx"]
with-postgres = ["fnsql-macro/with-postgres", "postgres", "tempdir"]
prepare-cache = ["fnsql-macro/prepare-cache"]

[dependencies]
fnsql-macro = "0.3.1"
tempdir = { version = "0.3", optional = true }
postgres = { version = "0.19", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"], optional = true }
